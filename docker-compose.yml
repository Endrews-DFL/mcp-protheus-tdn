services:
  protheus-mcp:
    build: .
    image: protheus-mcp-server:0.1.0
    container_name: protheus-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MCP_TRANSPORT: "http"
      HTTP_PORT: "8080"
      HTTP_PATH: "/mcp"
      PROTHEUS_BASE_URL: "${PROTHEUS_BASE_URL}"
      PROTHEUS_USER: "${PROTHEUS_USER}"
      PROTHEUS_PASSWORD: "${PROTHEUS_PASSWORD}"
      PROTHEUS_TENANT_ID: "${PROTHEUS_TENANT_ID}"
      PROTHEUS_DFL_TOKEN: "${PROTHEUS_DFL_TOKEN}"
      CONNECTOR_API_KEY: "${CONNECTOR_API_KEY}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
